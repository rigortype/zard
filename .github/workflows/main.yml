name: Ruby

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  lens:
    runs-on: ubuntu-latest
    name: Released Rigor lens
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Install standalone analyzer
        env:
          GEM_HOME: ${{ runner.temp }}/rigor
          GEM_PATH: ${{ runner.temp }}/rigor
        run: |
          RIGOR_VERSION=$(ruby -rjson -e 'puts JSON.parse(File.read("zard-rigor/lib/zard/rigor/compatibility.json")).fetch("default_version")')
          gem install prism --version 1.9.0 --no-document
          gem install rbs --version 4.2.0 --no-document
          gem install language_server-protocol --version 3.17.0.6 --no-document
          gem install rigortype --version "$RIGOR_VERSION" --no-document
          gem install rbs-inline --version 0.14.0 --no-document
          cat > "$RUNNER_TEMP/rigor-cli" <<'SH'
          #!/bin/sh
          unset RUBYOPT BUNDLE_GEMFILE BUNDLE_PATH
          GEM_HOME="$RUNNER_TEMP/rigor" GEM_PATH="$RUNNER_TEMP/rigor" exec ruby "$RUNNER_TEMP/rigor/bin/rigor" "$@"
          SH
          chmod +x "$RUNNER_TEMP/rigor-cli"
      - run: |
          ZARD_RIGOR_COMMAND="$RUNNER_TEMP/rigor-cli" bundle exec ruby -Itest test/rigor_lens_test.rb
          ZARD_RIGOR_COMMAND="$RUNNER_TEMP/rigor-cli" bundle exec ruby -Itest test/rigor_lens_boundaries_test.rb
          ZARD_RIGOR_COMMAND="$RUNNER_TEMP/rigor-cli" bundle exec ruby -Itest test/rigor_type_reference_links_test.rb

  astro:
    runs-on: ubuntu-latest
    name: Astro presentation
    defaults:
      run:
        working-directory: zard-doc-astro
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: zard-doc-astro/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zard-doc-astro/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - "3.2"
          - "3.3"
          - "3.4"
          - "4.0"

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

